services:
  pixelsong:
    build: .
    image: pixelsong:latest
    container_name: pixelsong
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: 3000
      # local = 账号/数据/文件都在本容器；cloud = 连远端云服务
      PS_MODE: ${PS_MODE:-local}
      # 邮件、人机验证、病毒扫描、CNKD 登录都在后台「设置」里配置，
      # 这里不需要再传密钥。只有显式使用 cloud 模式时才需要 PS_UPSTREAM / PS_ENDPOINT。
    # 服务器 DNS 被污染、或被代理软件的 fake-ip（198.18.x.x）接管时，固定公共 DNS
    # dns:
    #   - 223.5.5.5
    #   - 119.29.29.29
    volumes:
      - pixelsong-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pixelsong-data:
